name: Quality

# 开发分支与 PR 的静态门禁：typecheck + lint + 单元测试。
# 发布校验（tag）仍由 build-release.yml 负责。
# Node 采用 24（与本地开发环境一致）。
on:
    push:
        branches: [dev]
    pull_request:
        branches: [dev, main]

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    static-check:
        name: typecheck + lint + test
        runs-on: ubuntu-latest
        steps:
            - name: Check out Git repository
              uses: actions/checkout@v4
            - name: Install Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - name: Install dependencies
              run: npm ci
            - name: Type check
              run: npm run typecheck
            - name: Lint
              run: npm run lint
            - name: Unit tests
              run: npm run test
