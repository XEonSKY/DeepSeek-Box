name: Build & Release

# 发布策略：
# - 仅当在 main 分支上推送版本标签（v*）时发布新版本；
# - main 分支普通推送 / PR / 手动触发：只做类型检查与构建校验，不发版、不打包；
# - 标签必须位于 main 上，且与 package.json 的 version 一致，否则发布门禁失败。
# Node 采用 24（与本地开发环境一致），避免"本地过、CI 挂"的语法 / API 差异。
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# 默认只读；发布任务单独申请写权限
permissions:
  contents: read

# 同一 ref 上并发运行则取消旧的，避免重复发布
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 非标签事件：轻量校验，只在 ubuntu 上跑一次
  ci:
    name: CI (typecheck + build)
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Compile the app (electron-vite build)
        run: npm run build

  # 发布门禁：只在版本标签时运行，确保标签在 main 上并与版本一致
  gate:
    name: Verify release tag
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag must be on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
            echo "::error::tag ${{ github.ref_name }} is not on main; refuse to release"
            exit 1
          fi
      - name: Tag must match package.json version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$expected" != "${{ github.ref_name }}" ]; then
            echo "::error::tag ${{ github.ref_name }} does not match package.json $expected"
            exit 1
          fi

  # 发布：门禁通过后，三平台构建并上传到同一个 GitHub Release
  release:
    name: Release (${{ matrix.os }})
    needs: gate
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    env:
      # 无证书时跳过代码签名尝试（否则 mac/linux 无证书会失败）。
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # electron-builder 发布到 GitHub 所需的令牌（GitHub Actions 自动注入）。
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Compile the app (electron-vite build)
        run: npm run build
      # 发布类型必须按版本号决定：electron-updater 正式版线用 releases/latest 解析 tag，
      # 该端点不返回 prerelease；若固定为 prerelease，将来正式版会被永久钉死。
      # 含 -（alpha/beta/rc）→ prerelease；否则 → release。
      # 注意：这里只改内存里的对象、用 4 空格缩进写回，与仓库的 JSON 风格一致
      # （此前写死 2 空格，会让这次改动把 package.json 的缩进改坏）。
      - name: Resolve release type from version
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const releaseType = /-/.test(pkg.version) ? "prerelease" : "release";
            pkg.build.publish.releaseType = releaseType;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 4) + "\n");
            console.log("version " + pkg.version + " -> publish.releaseType = " + releaseType);
          '
      # 必须是已发布状态、不能停在 draft，否则 electron-updater 读不到。
      - name: Publish to GitHub Release
        run: npx electron-builder --publish always
